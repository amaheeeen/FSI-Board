name: fsi_board_mobile
description: FSI Board Mobile App for Jamaah and Mutawwif
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking & Auth
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^13.0.0

  # TGS (Audio & Video)
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.1.0

  # Tracking & Content
  geolocator: ^10.1.0
  audioplayers: ^5.2.1

  # UI Utility
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
